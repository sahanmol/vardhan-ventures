<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <rect width="400" height="400" fill="#141b3d"/>

  <!-- Top V: pointing down -->
  <path d="M 110 130 L 200 260 L 290 130"
        fill="none" stroke="#d8ff3e" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Bottom V: pointing up (inverted), overlapping the top V in the middle -->
  <path d="M 110 270 L 200 140 L 290 270"
        fill="none" stroke="#d8ff3e" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
